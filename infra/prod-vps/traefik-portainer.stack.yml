version: "3.8"

# =============================================================
# TSM EX OMNI — Infra da VPS de PRODUÇÃO: Traefik + Portainer
# Stack: `infra` (docker stack deploy -c traefik-portainer.stack.yml infra)
#
# Casa com docker-stack.prod.yml:
#   rede externa ........ ProxyGM
#   entrypoint HTTPS .... websecure
#   certresolver ........ letsencryptresolver
#   provider ............ Swarm (rótulos em deploy.labels dos serviços)
#
# Variáveis (exportar no shell antes do deploy; o bootstrap.sh com DEPLOY_INFRA=1 faz isso):
#   ACME_EMAIL          e-mail do Let's Encrypt (avisos de expiração)            [obrigatória]
#   PORTAINER_DOMAIN    ex.: portainer.tsmex.com.br (DNS A para o IP da VPS)      [obrigatória]
#   PORTAINER_ALLOWED_CIDRS  quem pode abrir o Portainer; padrão: qualquer IP.
#                       Recomendado: o IP fixo do escritório, ex.: 200.1.2.3/32
#   ACME_CASERVER       padrão: produção do Let's Encrypt. Para ensaio sem estourar o limite de
#                       emissões: https://acme-staging-v02.api.letsencrypt.org/directory
#
# Notas:
# - Traefik v3.7.20 e Portainer 2.39.9 (LTS) fixados; trocar de versão é decisão consciente
#   (ver docs/PRODUCAO_VPS.md, "Atualizar a infra").
# - Portas 80/443 em modo host: o Traefik enxerga o IP real do cliente (o modo ingress mascara).
#   Por isso o Traefik tem 1 réplica presa ao manager.
# - O painel do Traefik fica DESLIGADO (api.dashboard=false) e nenhuma porta 8080 é publicada.
# - O Traefik monta o docker.sock (somente leitura, mas equivale a acesso root ao host): só ele e o
#   agente do Portainer o montam. Não adicione outros serviços com esse volume.
# =============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  traefik:
    image: traefik:v3.7.20
    logging: *default-logging
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      - --log.format=json
      # Access log em JSON no stdout (rotacionado pelo daemon do Docker). Cabeçalhos descartados
      # para nunca gravar Authorization/Cookie.
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.bufferingsize=100
      - --accesslog.fields.defaultmode=keep
      - --accesslog.fields.headers.defaultmode=drop
      # Painel desligado. `ping` só alimenta o healthcheck do container (entrypoint interno `traefik`).
      - --api.dashboard=false
      - --ping=true
      - --providers.swarm=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=ProxyGM
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      # Cabeçalhos de segurança em TODA resposta HTTPS (middleware definido nos rótulos abaixo).
      - --entrypoints.websecure.http.middlewares=secure-headers@swarm
      # Let's Encrypt via TLS-ALPN-01 (porta 443; não depende do 80 nem do redirecionamento).
      - --certificatesresolvers.letsencryptresolver.acme.email=${ACME_EMAIL:?defina ACME_EMAIL}
      - --certificatesresolvers.letsencryptresolver.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencryptresolver.acme.caserver=${ACME_CASERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.letsencryptresolver.acme.tlschallenge=true
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - ProxyGM
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      # Provider Swarm precisa do manager; porta em modo host exige nó fixo.
      placement:
        constraints: [node.role == manager]
      update_config:
        parallelism: 1
        # Portas em modo host: não dá para subir a nova antes de parar a velha (porta ocupada).
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
      labels:
        # Middleware global (aplicado no entrypoint websecure). Sem CSP de propósito: a CSP é da
        # aplicação (nginx do web); aqui só o que é seguro para qualquer serviço.
        - "traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000"
        - "traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true"
        - "traefik.http.middlewares.secure-headers.headers.stsPreload=false"
        - "traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true"
        - "traefik.http.middlewares.secure-headers.headers.customFrameOptionsValue=SAMEORIGIN"
        - "traefik.http.middlewares.secure-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
        - "traefik.http.middlewares.secure-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(self), payment=()"
        - "traefik.http.middlewares.secure-headers.headers.customResponseHeaders.X-Powered-By="
        - "traefik.http.middlewares.secure-headers.headers.customResponseHeaders.Server="

  portainer:
    image: portainer/portainer-ce:2.39.9
    logging: *default-logging
    # Fala com o agente (tasks.agent resolve para todos os nós do Swarm).
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    volumes:
      - portainer_data:/data
    networks:
      - agent_network
      - ProxyGM
    stop_grace_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 30s
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 64M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=ProxyGM"
        - "traefik.http.middlewares.portainer-allow.ipallowlist.sourcerange=${PORTAINER_ALLOWED_CIDRS:-0.0.0.0/0,::/0}"
        - "traefik.http.routers.portainer.rule=Host(`${PORTAINER_DOMAIN:?defina PORTAINER_DOMAIN}`)"
        - "traefik.http.routers.portainer.entrypoints=websecure"
        - "traefik.http.routers.portainer.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.portainer.middlewares=portainer-allow"
        - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  agent:
    image: portainer/agent:2.39.9
    logging: *default-logging
    environment:
      AGENT_CLUSTER_ADDR: tasks.agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - agent_network
    deploy:
      # Um agente por nó (inclusive nós adicionados depois).
      mode: global
      placement:
        constraints: [node.platform.os == linux]
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 32M

volumes:
  traefik_letsencrypt:
  portainer_data:

networks:
  # Mesma rede dos stacks da aplicação (criada por bootstrap.sh).
  ProxyGM:
    external: true
  # Só Portainer <-> agente.
  agent_network:
    driver: overlay
    attachable: false
