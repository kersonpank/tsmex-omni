version: "3.8"

# =============================================================
# TSM EX OMNI — Docker Swarm Stack: PRODUÇÃO
# Domínio: tsmex.com.br
# Deploy: via GitHub Actions (branch main) com approval manual
# =============================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tsmex
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tsmex-prod-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.role == manager]

  redis:
    image: redis:7-alpine
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tsmex-prod-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_prod_data:/data
    networks:
      - ProxyGM
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints: [node.role == manager]
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=ProxyGM"
        - "traefik.http.routers.tsmex-prod-minio.rule=Host(`${MINIO_HOST}`)"
        - "traefik.http.routers.tsmex-prod-minio.entrypoints=websecure"
        - "traefik.http.routers.tsmex-prod-minio.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.tsmex-prod-minio.loadbalancer.server.port=9000"

  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY}/tsmex-migrate:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATE_MODE: deploy
      RUN_SEED: ${RUN_SEED:-false}
      RUN_MIGRATE_PERSONS: ${RUN_MIGRATE_PERSONS:-false}
    networks:
      - tsmex-prod-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  api:
    image: ghcr.io/${GITHUB_REPOSITORY}/tsmex-api:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3002
      HOST: "0.0.0.0"
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGIN: https://tsmex.com.br
      S3_ENDPOINT: ${S3_ENDPOINT:-https://${MINIO_HOST}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-https://${MINIO_HOST}}
      S3_SIGNED_URL_PUBLIC_HOST: ${S3_SIGNED_URL_PUBLIC_HOST:-https://${MINIO_HOST}}
      UPLOAD_MAX_SIZE_BYTES: ${UPLOAD_MAX_SIZE_BYTES:-10485760}
      ACBR_CLIENT_ID: ${ACBR_CLIENT_ID:-}
      ACBR_CLIENT_SECRET: ${ACBR_CLIENT_SECRET:-}
      ACBR_TOKEN_URL: ${ACBR_TOKEN_URL:-}
      ACBR_API_BASE_URL: ${ACBR_API_BASE_URL:-}
      ACBR_FALLBACK_CMUN: ${ACBR_FALLBACK_CMUN:-}
      FISCAL_CTE_PROVIDER: ${FISCAL_CTE_PROVIDER:-}
      FISCAL_PROVIDER: ${FISCAL_PROVIDER:-}
      FISCAL_SECRET_KEY: ${FISCAL_SECRET_KEY:-}
      SINTEGRA_TOKEN: ${SINTEGRA_TOKEN:-}
    networks:
      - tsmex-prod-internal
      - ProxyGM
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=ProxyGM"
        - "traefik.http.routers.tsmex-prod-api.rule=Host(`tsmex.com.br`) && PathPrefix(`/api`)"
        - "traefik.http.routers.tsmex-prod-api.entrypoints=websecure"
        - "traefik.http.routers.tsmex-prod-api.priority=100"
        - "traefik.http.routers.tsmex-prod-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.tsmex-prod-api.loadbalancer.server.port=3002"

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY}/tsmex-api:latest
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://${MINIO_HOST}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-https://${MINIO_HOST}}
      S3_SIGNED_URL_PUBLIC_HOST: ${S3_SIGNED_URL_PUBLIC_HOST:-https://${MINIO_HOST}}
      UPLOAD_MAX_SIZE_BYTES: ${UPLOAD_MAX_SIZE_BYTES:-10485760}
      ACBR_CLIENT_ID: ${ACBR_CLIENT_ID:-}
      ACBR_CLIENT_SECRET: ${ACBR_CLIENT_SECRET:-}
      ACBR_TOKEN_URL: ${ACBR_TOKEN_URL:-}
      ACBR_API_BASE_URL: ${ACBR_API_BASE_URL:-}
      ACBR_FALLBACK_CMUN: ${ACBR_FALLBACK_CMUN:-}
      FISCAL_CTE_PROVIDER: ${FISCAL_CTE_PROVIDER:-}
      FISCAL_PROVIDER: ${FISCAL_PROVIDER:-}
      FISCAL_SECRET_KEY: ${FISCAL_SECRET_KEY:-}
    # Mesma imagem do `api`, mas roda o worker BullMQ (fila de emissão de CT-e) — não sobe
    # HTTP, então o HEALTHCHECK da imagem (GET /health) sempre falharia; desabilitado aqui.
    healthcheck:
      disable: true
    networks:
      - tsmex-prod-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s

  web:
    image: ghcr.io/${GITHUB_REPOSITORY}/tsmex-web:latest
    environment:
      NGINX_API_HOST: tasks.api
    networks:
      - tsmex-prod-internal
      - ProxyGM
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.tsmex-prod.rule=Host(`tsmex.com.br`)"
        - "traefik.http.routers.tsmex-prod.entrypoints=websecure"
        - "traefik.http.routers.tsmex-prod.priority=1"
        - "traefik.http.routers.tsmex-prod.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.tsmex-prod.loadbalancer.server.port=80"

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:

networks:
  tsmex-prod-internal:
    driver: overlay
  ProxyGM:
    external: true
