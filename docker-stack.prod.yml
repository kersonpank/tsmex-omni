version: "3.8"

# Log de cada container limitado (sem isto o json-file cresce até encher o disco do servidor).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# =============================================================
# TSM EX OMNI — Docker Swarm Stack: PRODUÇÃO
# Domínio: tsmex.com.br
# Deploy: via GitHub Actions (branch main) com approval manual
# =============================================================

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tsmex
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tsmex-prod-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.role == manager]

  redis:
    image: redis:7-alpine
    logging: *default-logging
    # As filas fiscais (CT-e, CIOT, NF-e) vivem aqui: AOF para não perder job num restart e
    # noeviction (exigência do BullMQ) para o Redis nunca apagar job por falta de memória.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tsmex-prod-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_prod_data:/data
    logging: *default-logging
    networks:
      # Interna: o serviço de backup espelha o bucket sem sair pela internet.
      - tsmex-prod-internal
      - ProxyGM
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints: [node.role == manager]
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=ProxyGM"
        - "traefik.http.routers.tsmex-prod-minio.rule=Host(`${MINIO_HOST}`)"
        - "traefik.http.routers.tsmex-prod-minio.entrypoints=websecure"
        - "traefik.http.routers.tsmex-prod-minio.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.tsmex-prod-minio.loadbalancer.server.port=9000"

  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY}/tsmex-migrate:latest
    logging: *default-logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATE_MODE: deploy
      NODE_ENV: production
      RUN_SEED: ${RUN_SEED:-false}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      RUN_MIGRATE_PERSONS: ${RUN_MIGRATE_PERSONS:-false}
    networks:
      - tsmex-prod-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  api:
    image: ghcr.io/${GITHUB_REPOSITORY}/tsmex-api:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3002
      HOST: "0.0.0.0"
      NODE_ENV: production
      # Nome qualificado do serviço Swarm, não o alias curto "redis": `api` também está na rede
      # compartilhada `ProxyGM` (necessário pro Traefik rotear /api) — e essa rede é `external:
      # true`, ou seja, é a MESMA rede física de todos os stacks deste host. Em staging isso
      # causou o alias curto "redis" resolver pro Redis de PRODUÇÃO de outro cliente
      # (resio-producao), porque o stack dele também registra "redis" nessa rede compartilhada.
      # Mesmo risco existe aqui. Ver docs/STACK_ROLLOUT_RUNBOOK.md.
      REDIS_URL: ${REDIS_URL:-redis://tsmexomni-prod_redis:6379}
      CORS_ORIGIN: https://tsmex.com.br
      S3_ENDPOINT: ${S3_ENDPOINT:-https://${MINIO_HOST}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-https://${MINIO_HOST}}
      S3_SIGNED_URL_PUBLIC_HOST: ${S3_SIGNED_URL_PUBLIC_HOST:-https://${MINIO_HOST}}
      UPLOAD_MAX_SIZE_BYTES: ${UPLOAD_MAX_SIZE_BYTES:-10485760}
      ACBR_CLIENT_ID: ${ACBR_CLIENT_ID:-}
      ACBR_CLIENT_SECRET: ${ACBR_CLIENT_SECRET:-}
      EFRETE_HOMOLOGACAO_USUARIO: ${EFRETE_HOMOLOGACAO_USUARIO:-}
      EFRETE_HOMOLOGACAO_SENHA: ${EFRETE_HOMOLOGACAO_SENHA:-}
      EFRETE_HOMOLOGACAO_INTEGRADOR: ${EFRETE_HOMOLOGACAO_INTEGRADOR:-}
      EFRETE_HOMOLOGACAO_INTEGRADOR_CNPJ: ${EFRETE_HOMOLOGACAO_INTEGRADOR_CNPJ:-}
      EFRETE_PRODUCAO_USUARIO: ${EFRETE_PRODUCAO_USUARIO:-}
      EFRETE_PRODUCAO_SENHA: ${EFRETE_PRODUCAO_SENHA:-}
      EFRETE_PRODUCAO_INTEGRADOR: ${EFRETE_PRODUCAO_INTEGRADOR:-}
      EFRETE_PRODUCAO_INTEGRADOR_CNPJ: ${EFRETE_PRODUCAO_INTEGRADOR_CNPJ:-}
      ACBR_CLIENT_ID_PRODUCAO: ${ACBR_CLIENT_ID_PRODUCAO:-}
      ACBR_CLIENT_SECRET_PRODUCAO: ${ACBR_CLIENT_SECRET_PRODUCAO:-}
      ACBR_TOKEN_URL: ${ACBR_TOKEN_URL:-}
      ACBR_API_BASE_URL: ${ACBR_API_BASE_URL:-}
      ACBR_FALLBACK_CMUN: ${ACBR_FALLBACK_CMUN:-}
      FISCAL_CTE_PROVIDER: ${FISCAL_CTE_PROVIDER:-}
      FISCAL_PROVIDER: ${FISCAL_PROVIDER:-}
      FISCAL_SECRET_KEY: ${FISCAL_SECRET_KEY:-}
      SINTEGRA_TOKEN: ${SINTEGRA_TOKEN:-}
      # Alerta de operação (erro 500, queda de processo, SystemAlert crítico) — webhook do n8n/WhatsApp.
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      OPS_ALERT_WEBHOOK_TOKEN: ${OPS_ALERT_WEBHOOK_TOKEN:-}
      OPS_ALERT_ENVIRONMENT: producao
    logging: *default-logging
    stop_grace_period: 30s
    networks:
      - tsmex-prod-internal
      - ProxyGM
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=ProxyGM"
        - "traefik.http.routers.tsmex-prod-api.rule=Host(`tsmex.com.br`) && PathPrefix(`/api`)"
        - "traefik.http.routers.tsmex-prod-api.entrypoints=websecure"
        - "traefik.http.routers.tsmex-prod-api.priority=100"
        - "traefik.http.routers.tsmex-prod-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.tsmex-prod-api.loadbalancer.server.port=3002"

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY}/tsmex-api:latest
    command: ["node", "dist/worker.js"]
    # Migração do legado (.github/workflows/legacy-migration.yml): dados baixados sobrevivem a redeploy.
    volumes:
      - legacy_prod_data:/app/legacy-data
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      # Ver comentário equivalente no serviço `api` acima.
      REDIS_URL: ${REDIS_URL:-redis://tsmexomni-prod_redis:6379}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://${MINIO_HOST}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-https://${MINIO_HOST}}
      S3_SIGNED_URL_PUBLIC_HOST: ${S3_SIGNED_URL_PUBLIC_HOST:-https://${MINIO_HOST}}
      UPLOAD_MAX_SIZE_BYTES: ${UPLOAD_MAX_SIZE_BYTES:-10485760}
      ACBR_CLIENT_ID: ${ACBR_CLIENT_ID:-}
      ACBR_CLIENT_SECRET: ${ACBR_CLIENT_SECRET:-}
      EFRETE_HOMOLOGACAO_USUARIO: ${EFRETE_HOMOLOGACAO_USUARIO:-}
      EFRETE_HOMOLOGACAO_SENHA: ${EFRETE_HOMOLOGACAO_SENHA:-}
      EFRETE_HOMOLOGACAO_INTEGRADOR: ${EFRETE_HOMOLOGACAO_INTEGRADOR:-}
      EFRETE_HOMOLOGACAO_INTEGRADOR_CNPJ: ${EFRETE_HOMOLOGACAO_INTEGRADOR_CNPJ:-}
      EFRETE_PRODUCAO_USUARIO: ${EFRETE_PRODUCAO_USUARIO:-}
      EFRETE_PRODUCAO_SENHA: ${EFRETE_PRODUCAO_SENHA:-}
      EFRETE_PRODUCAO_INTEGRADOR: ${EFRETE_PRODUCAO_INTEGRADOR:-}
      EFRETE_PRODUCAO_INTEGRADOR_CNPJ: ${EFRETE_PRODUCAO_INTEGRADOR_CNPJ:-}
      ACBR_CLIENT_ID_PRODUCAO: ${ACBR_CLIENT_ID_PRODUCAO:-}
      ACBR_CLIENT_SECRET_PRODUCAO: ${ACBR_CLIENT_SECRET_PRODUCAO:-}
      ACBR_TOKEN_URL: ${ACBR_TOKEN_URL:-}
      ACBR_API_BASE_URL: ${ACBR_API_BASE_URL:-}
      ACBR_FALLBACK_CMUN: ${ACBR_FALLBACK_CMUN:-}
      FISCAL_CTE_PROVIDER: ${FISCAL_CTE_PROVIDER:-}
      FISCAL_PROVIDER: ${FISCAL_PROVIDER:-}
      FISCAL_SECRET_KEY: ${FISCAL_SECRET_KEY:-}
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      OPS_ALERT_WEBHOOK_TOKEN: ${OPS_ALERT_WEBHOOK_TOKEN:-}
      OPS_ALERT_ENVIRONMENT: producao
      # Worker alerta quando o backup passa da janela sem sucesso (tabela BackupRun).
      BACKUP_MONITOR_ENABLED: "true"
    logging: *default-logging
    # Encerramento limpo: o worker termina o job fiscal em andamento antes de sair.
    stop_grace_period: 60s
    # Healthcheck ativo valida conectividade TCP com Redis e Postgres a cada 20s.
    # Em caso de congelamento do socket TCP no Swarm, o container e auto-reiniciado.
    healthcheck:
      test: ["CMD", "node", "dist/workerHealth.js"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - tsmex-prod-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s

  web:
    image: ghcr.io/${GITHUB_REPOSITORY}/tsmex-web:latest
    logging: *default-logging
    environment:
      NGINX_API_HOST: tasks.api
    networks:
      - tsmex-prod-internal
      - ProxyGM
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        # Web está em 2 redes: sem isto o Traefik às vezes escolhe o IP da rede interna → 504 nos assets.
        - "traefik.docker.network=ProxyGM"
        - "traefik.http.routers.tsmex-prod.rule=Host(`tsmex.com.br`)"
        - "traefik.http.routers.tsmex-prod.entrypoints=websecure"
        - "traefik.http.routers.tsmex-prod.priority=1"
        - "traefik.http.routers.tsmex-prod.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.tsmex-prod.loadbalancer.server.port=80"

  # Backup para FORA deste servidor: dump cifrado do banco (age) a cada hora, espelho do bucket com
  # histórico de apagados, teste de restauração semanal. Cada execução vai para a tabela BackupRun e o
  # worker alerta se parar. Destino: remote "offsite" do rclone (S3 de outro provedor). Ver
  # docs/PRODUCAO_GO_LIVE.md.
  backup:
    image: ghcr.io/${GITHUB_REPOSITORY}/tsmex-backup:latest
    logging: *default-logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_BUCKET: ${S3_BUCKET}
      BACKUP_OFFSITE_BUCKET: ${BACKUP_OFFSITE_BUCKET}
      BACKUP_OFFSITE_PREFIX: ${BACKUP_OFFSITE_PREFIX:-tsmex-prod}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT}
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-60}
      BACKUP_OBJECTS_INTERVAL_MINUTES: ${BACKUP_OBJECTS_INTERVAL_MINUTES:-360}
      BACKUP_RESTORE_TEST_INTERVAL_HOURS: ${BACKUP_RESTORE_TEST_INTERVAL_HOURS:-168}
      # Destino externo (S3 compatível de OUTRO provedor, com versionamento/object lock).
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_OFFSITE_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_OFFSITE_ENDPOINT}
      RCLONE_CONFIG_OFFSITE_REGION: ${BACKUP_OFFSITE_REGION:-us-east-1}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_OFFSITE_ACCESS_KEY}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_OFFSITE_SECRET_KEY}
      # Origem dos arquivos: o MinIO deste stack, pela rede interna.
      RCLONE_CONFIG_LOCAL_TYPE: s3
      RCLONE_CONFIG_LOCAL_PROVIDER: Minio
      RCLONE_CONFIG_LOCAL_ENDPOINT: http://tsmexomni-prod_minio:9000
      RCLONE_CONFIG_LOCAL_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      RCLONE_CONFIG_LOCAL_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      OPS_ALERT_WEBHOOK_TOKEN: ${OPS_ALERT_WEBHOOK_TOKEN:-}
      OPS_ALERT_ENVIRONMENT: producao
    volumes:
      - backup_prod_state:/var/lib/tsmex-backup
    networks:
      - tsmex-prod-internal
    stop_grace_period: 120s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 30s
      placement:
        constraints: [node.role == manager]

volumes:
  legacy_prod_data:
  backup_prod_state:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:

networks:
  tsmex-prod-internal:
    driver: overlay
  ProxyGM:
    external: true