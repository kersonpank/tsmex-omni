name: Deploy Staging

on:
  push:
    branches:
      - develop

env:
  # github.repository = "kersonpank/tsmex-omni" → imagem: ghcr.io/kersonpank/tsmex-omni/tsmex-api:staging
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build, Push & Deploy to Staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag (short SHA)
        id: vars
        run: echo "SHA_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # API: sem cache-from do registry — evita reutilizar layer antiga de dist quando o contexto
      # não invalida como esperado (sintoma: task com log antigo "localhost" e 502 no Nginx).
      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/tsmex-api:staging
            ${{ env.IMAGE_PREFIX }}/tsmex-api:${{ steps.vars.outputs.SHA_TAG }}

      - name: Build & Push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/tsmex-web:staging
            ${{ env.IMAGE_PREFIX }}/tsmex-web:${{ steps.vars.outputs.SHA_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/tsmex-web:staging
          cache-to: type=inline

      - name: Build & Push Migrate
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/tsmex-migrate:staging
            ${{ env.IMAGE_PREFIX }}/tsmex-migrate:${{ steps.vars.outputs.SHA_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/tsmex-migrate:staging
          cache-to: type=inline

      - name: Deploy to Staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE_PREFIX }}/tsmex-api:staging
            docker pull ${{ env.IMAGE_PREFIX }}/tsmex-web:staging

            # Traefik: /api vai direto à API (mesma rede ProxyGM). Evita Nginx no web resolver "api"
            # na overlay (connection refused / DNS multi-rede).
            API_SVC=staging-tsmex-dev_api
            PROXY_GM_ID=$(docker network inspect ProxyGM -f '{{.Id}}' 2>/dev/null || true)
            if [ -n "$PROXY_GM_ID" ]; then
              API_NETS=$(docker service inspect "$API_SVC" --format '{{range .Spec.TaskTemplate.Networks}}{{.Target}} {{end}}' 2>/dev/null || true)
              if ! echo "$API_NETS" | grep -q "$PROXY_GM_ID"; then
                echo "Anexando ProxyGM ao serviço API..."
                docker service update --network-add ProxyGM "$API_SVC"
                sleep 10
              fi
            fi

            API_LABELS=$(docker service inspect "$API_SVC" --format '{{json .Spec.Labels}}' 2>/dev/null || echo '{}')
            if echo "$API_LABELS" | grep -q 'traefik.http.routers.tsmex-staging-api.rule'; then
              docker service update \
                --image ${{ env.IMAGE_PREFIX }}/tsmex-api:staging \
                --with-registry-auth \
                --force \
                "$API_SVC"
            else
              docker service update \
                --image ${{ env.IMAGE_PREFIX }}/tsmex-api:staging \
                --with-registry-auth \
                --force \
                --label-add "traefik.enable=true" \
                --label-add "traefik.docker.network=ProxyGM" \
                --label-add 'traefik.http.routers.tsmex-staging-api.rule=Host(`tsm.mesquitagrupo.com.br`) && PathPrefix(`/api`)' \
                --label-add "traefik.http.routers.tsmex-staging-api.entrypoints=websecure" \
                --label-add "traefik.http.routers.tsmex-staging-api.priority=100" \
                --label-add "traefik.http.routers.tsmex-staging-api.tls.certresolver=letsencryptresolver" \
                --label-add "traefik.http.services.tsmex-staging-api.loadbalancer.server.port=3002" \
                "$API_SVC"
            fi

            WEB_SVC=staging-tsmex-dev_web
            WEB_ENVS=$(docker service inspect "$WEB_SVC" --format '{{range .Spec.TaskTemplate.ContainerSpec.Env}}{{.Name}}={{.Value}};{{end}}' 2>/dev/null || true)
            if echo "$WEB_ENVS" | grep -q 'NGINX_API_HOST=tasks.api'; then
              docker service update \
                --image ${{ env.IMAGE_PREFIX }}/tsmex-web:staging \
                --with-registry-auth \
                --force \
                "$WEB_SVC"
            else
              docker service update --env-rm NGINX_API_HOST "$WEB_SVC" 2>/dev/null || true
              sleep 6
              docker service update \
                --image ${{ env.IMAGE_PREFIX }}/tsmex-web:staging \
                --with-registry-auth \
                --force \
                --env-add NGINX_API_HOST=tasks.api \
                "$WEB_SVC"
            fi
            echo "Staging deploy OK: ${{ steps.vars.outputs.SHA_TAG }}"
