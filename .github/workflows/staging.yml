name: Deploy Staging

on:
  push:
    branches:
      - develop

env:
  # github.repository = "kersonpank/tsmex-omni" → imagem: ghcr.io/kersonpank/tsmex-omni/tsmex-api:staging
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build, Push & Deploy to Staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag (short SHA)
        id: vars
        run: echo "SHA_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # API: sem cache-from do registry — evita reutilizar layer antiga de dist quando o contexto
      # não invalida como esperado (sintoma: task com log antigo "localhost" e 502 no Nginx).
      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/tsmex-api:staging
            ${{ env.IMAGE_PREFIX }}/tsmex-api:${{ steps.vars.outputs.SHA_TAG }}

      - name: Build & Push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/tsmex-web:staging
            ${{ env.IMAGE_PREFIX }}/tsmex-web:${{ steps.vars.outputs.SHA_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/tsmex-web:staging
          cache-to: type=inline

      - name: Build & Push Migrate
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/tsmex-migrate:staging
            ${{ env.IMAGE_PREFIX }}/tsmex-migrate:${{ steps.vars.outputs.SHA_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/tsmex-migrate:staging
          cache-to: type=inline

      - name: Deploy to Staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE_PREFIX }}/tsmex-api:staging
            docker pull ${{ env.IMAGE_PREFIX }}/tsmex-web:staging
            docker pull ${{ env.IMAGE_PREFIX }}/tsmex-migrate:staging

            STACK_NAME=staging-tsmex-dev
            STACK_FILE=/opt/tsmex/docker-stack.staging.yml

            docker stack deploy -c "$STACK_FILE" "$STACK_NAME" --with-registry-auth --prune

            MIGRATE_SVC=${STACK_NAME}_migrate
            docker service update --force --with-registry-auth "$MIGRATE_SVC"

            echo "Aguardando migração concluir..."
            for i in $(seq 1 60); do
              RUNNING=$(docker service ps "$MIGRATE_SVC" --filter desired-state=running --format '{{.CurrentState}}' | wc -l | tr -d ' ')
              FAILED=$(docker service ps "$MIGRATE_SVC" --format '{{.CurrentState}}' | grep -cE 'Failed|Rejected|Error' || true)
              if [ "${FAILED}" -gt 0 ]; then
                echo "❌ Migração falhou."
                docker service ps "$MIGRATE_SVC" --no-trunc
                exit 1
              fi
              if [ "${RUNNING}" -eq 0 ]; then
                break
              fi
              sleep 5
            done

            docker service update --force --with-registry-auth ${STACK_NAME}_api
            docker service update --force --with-registry-auth ${STACK_NAME}_web
            echo "Staging deploy OK: ${{ steps.vars.outputs.SHA_TAG }}"
