name: Deploy Staging

on:
  push:
    branches:
      - develop
  # Permite reaplicar credenciais (ACBR_CLIENT_ID/SECRET) manualmente pelo botão "Run workflow"
  # no GitHub Actions, sem precisar de um commit novo — cobre o caso de o usuário ter apagado
  # os serviços e recriado o stack pelo Portainer (cujo painel de env vars já provou não ser
  # confiável nessa reaplicação).
  workflow_dispatch: {}

env:
  # github.repository = "kersonpank/tsmex-omni" → imagem: ghcr.io/kersonpank/tsmex-omni/tsmex-api:staging
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-deploy:
    name: Build, Push & Deploy to Staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag (short SHA)
        id: vars
        run: echo "SHA_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # API: sem cache-from do registry — evita reutilizar layer antiga de dist quando o contexto
      # não invalida como esperado (sintoma: task com log antigo "localhost" e 502 no Nginx).
      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/tsmex-api:staging
            ${{ env.IMAGE_PREFIX }}/tsmex-api:${{ steps.vars.outputs.SHA_TAG }}

      - name: Build & Push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/tsmex-web:staging
            ${{ env.IMAGE_PREFIX }}/tsmex-web:${{ steps.vars.outputs.SHA_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/tsmex-web:staging
          cache-to: type=inline

      - name: Build & Push Migrate
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/tsmex-migrate:staging
            ${{ env.IMAGE_PREFIX }}/tsmex-migrate:${{ steps.vars.outputs.SHA_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/tsmex-migrate:staging
          cache-to: type=inline

      - name: Deploy to Staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE_PREFIX }}/tsmex-api:staging
            docker pull ${{ env.IMAGE_PREFIX }}/tsmex-web:staging
            docker pull ${{ env.IMAGE_PREFIX }}/tsmex-migrate:staging

            STACK_PREFIX=staging-tsmex-dev
            API_SVC=${STACK_PREFIX}_api
            WEB_SVC=${STACK_PREFIX}_web
            MIGRATE_SVC=${STACK_PREFIX}_migrate
            WORKER_SVC=${STACK_PREFIX}_worker

            for svc in "$API_SVC" "$WEB_SVC" "$MIGRATE_SVC" "$WORKER_SVC"; do
              if ! docker service inspect "$svc" >/dev/null 2>&1; then
                echo "❌ Serviço não encontrado: $svc"
                echo "Serviços disponíveis no Swarm:"
                docker service ls
                echo "Ação necessária: criar o stack '$STACK_PREFIX' no Portainer com docker-stack.staging.yml e as envs de docs/STACK_ENV_MATRIX.md (ver docs/STACK_ROLLOUT_RUNBOOK.md)."
                exit 1
              fi
            done

            # -d: não aguarda convergência; o loop abaixo monitora. Sem isso, o update retorna 1
            # se a task falha, matando o script antes de coletarmos logs.
            docker service update -d --image ${{ env.IMAGE_PREFIX }}/tsmex-migrate:staging --with-registry-auth --force "$MIGRATE_SVC"

            echo "Aguardando migração concluir..."
            sleep 5
            for i in $(seq 1 60); do
              # head -1: apenas a task mais recente (evita falso positivo em tasks antigas)
              LAST_STATE=$(docker service ps "$MIGRATE_SVC" --no-trunc --format '{{.CurrentState}}' 2>/dev/null | head -1)
              if echo "$LAST_STATE" | grep -qE 'Failed|Rejected|Error'; then
                echo "❌ Migração falhou. Estado: $LAST_STATE"
                docker service ps "$MIGRATE_SVC" --no-trunc
                echo "--- Logs do migrate (últimas 200 linhas) ---"
                docker service logs "$MIGRATE_SVC" --tail 200 --raw 2>&1 || true
                exit 1
              fi
              if ! echo "$LAST_STATE" | grep -qE 'Running|Preparing|Starting'; then
                echo "Migração concluída. Estado: $LAST_STATE"
                break
              fi
              sleep 5
            done

            # Reaplica ACBR_CLIENT_ID/SECRET direto no Swarm a cada deploy, a partir dos GitHub
            # Secrets — nunca depende do painel "Environment variables" do Portainer, que já
            # demonstrou não reaplicar de forma confiável quando o stack é recriado do zero.
            # Guarda: só inclui --env-add se os secrets estiverem cadastrados, pra nunca
            # sobrescrever um valor bom do serviço com uma string vazia.
            ACBR_ID_VAL="${{ secrets.ACBR_CLIENT_ID }}"
            ACBR_SECRET_VAL="${{ secrets.ACBR_CLIENT_SECRET }}"
            EXTRA_ENV_ARGS=()
            if [ -n "$ACBR_ID_VAL" ] && [ -n "$ACBR_SECRET_VAL" ]; then
              EXTRA_ENV_ARGS=(--env-add "ACBR_CLIENT_ID=$ACBR_ID_VAL" --env-add "ACBR_CLIENT_SECRET=$ACBR_SECRET_VAL")
              echo "✅ ACBR_CLIENT_ID/SECRET presentes nos GitHub Secrets — reaplicando em api/worker."
            else
              echo "⚠️  ACBR_CLIENT_ID/SECRET não configurados nos GitHub Secrets (Settings → Secrets and variables → Actions) — pulando --env-add, mantendo valor atual do serviço."
            fi

            # Par de credencial de PRODUÇÃO (tipo diferente do Sandbox no console ACBr — nunca a
            # mesma credencial). Só usado quando algum FiscalEmitter tem environment=PRODUCAO;
            # opcional, mesma guarda condicional do bloco Sandbox acima.
            ACBR_ID_PROD_VAL="${{ secrets.ACBR_CLIENT_ID_PRODUCAO }}"
            ACBR_SECRET_PROD_VAL="${{ secrets.ACBR_CLIENT_SECRET_PRODUCAO }}"
            if [ -n "$ACBR_ID_PROD_VAL" ] && [ -n "$ACBR_SECRET_PROD_VAL" ]; then
              EXTRA_ENV_ARGS+=(--env-add "ACBR_CLIENT_ID_PRODUCAO=$ACBR_ID_PROD_VAL" --env-add "ACBR_CLIENT_SECRET_PRODUCAO=$ACBR_SECRET_PROD_VAL")
              echo "✅ ACBR_CLIENT_ID_PRODUCAO/SECRET_PRODUCAO presentes nos GitHub Secrets — reaplicando em api/worker."
            else
              echo "⚠️  ACBR_CLIENT_ID_PRODUCAO/SECRET_PRODUCAO não configurados — pulando --env-add, mantendo valor atual do serviço."
            fi

            EFRETE_HOM_USER="${{ secrets.EFRETE_HOMOLOGACAO_USUARIO }}"
            EFRETE_HOM_PASS="${{ secrets.EFRETE_HOMOLOGACAO_SENHA }}"
            EFRETE_HOM_INT="${{ secrets.EFRETE_HOMOLOGACAO_INTEGRADOR }}"
            EFRETE_HOM_CNPJ="${{ secrets.EFRETE_HOMOLOGACAO_INTEGRADOR_CNPJ }}"
            EFRETE_MISSING=()
            [ -n "$EFRETE_HOM_USER" ] || EFRETE_MISSING+=(EFRETE_HOMOLOGACAO_USUARIO)
            [ -n "$EFRETE_HOM_PASS" ] || EFRETE_MISSING+=(EFRETE_HOMOLOGACAO_SENHA)
            [ -n "$EFRETE_HOM_INT" ] || EFRETE_MISSING+=(EFRETE_HOMOLOGACAO_INTEGRADOR)
            [ -n "$EFRETE_HOM_CNPJ" ] || EFRETE_MISSING+=(EFRETE_HOMOLOGACAO_INTEGRADOR_CNPJ)
            if [ ${#EFRETE_MISSING[@]} -eq 0 ]; then
              EXTRA_ENV_ARGS+=(--env-add "EFRETE_HOMOLOGACAO_USUARIO=$EFRETE_HOM_USER" --env-add "EFRETE_HOMOLOGACAO_SENHA=$EFRETE_HOM_PASS" --env-add "EFRETE_HOMOLOGACAO_INTEGRADOR=$EFRETE_HOM_INT" --env-add "EFRETE_HOMOLOGACAO_INTEGRADOR_CNPJ=$EFRETE_HOM_CNPJ")
              echo "✅ eFrete homologação: quatro secrets presentes; reaplicando em api/worker."
            else
              echo "⚠️ eFrete homologação incompleto; mantendo valores atuais. Ausentes: ${EFRETE_MISSING[*]}"
            fi

            # Reaplica REDIS_URL com o nome de serviço Swarm qualificado a cada deploy — não o
            # alias curto "redis", que colide com o alias "redis" de OUTROS stacks deste mesmo
            # host na rede compartilhada ProxyGM (ex.: já causou o `api` resolver pro Redis de
            # outro cliente em vez do próprio, silenciosamente). Não depende do painel do
            # Portainer pelo mesmo motivo do bloco ACBR acima. Não é secret — sempre reaplicado.
            EXTRA_ENV_ARGS+=(--env-add "REDIS_URL=redis://${STACK_PREFIX}_redis:6379")

            OLD_API_TASK_ID=$(docker service ps "$API_SVC" --filter desired-state=running --format '{{.ID}}' | head -1)
            docker service update -d --image ${{ env.IMAGE_PREFIX }}/tsmex-api:staging "${EXTRA_ENV_ARGS[@]}" --with-registry-auth --force "$API_SVC"
            docker service update -d --image ${{ env.IMAGE_PREFIX }}/tsmex-api:staging "${EXTRA_ENV_ARGS[@]}" --with-registry-auth --force "$WORKER_SVC"
            docker service update -d --image ${{ env.IMAGE_PREFIX }}/tsmex-web:staging --with-registry-auth --force "$WEB_SVC"
            echo "Aguardando a nova task da API para diagnóstico eFrete..."
            API_TASK_ID=""
            API_CID=""
            for i in $(seq 1 36); do
              API_TASK_ID=$(docker service ps "$API_SVC" --filter desired-state=running --format '{{.ID}} {{.CurrentState}}' | awk -v old="$OLD_API_TASK_ID" '$1 != old && $2 == "Running" {print $1; exit}')
              if [ -n "$API_TASK_ID" ]; then
                API_CID=$(docker ps --filter "label=com.docker.swarm.task.id=$API_TASK_ID" --filter status=running --format '{{.ID}}' | head -1)
              fi
              if [ -n "$API_CID" ]; then break; fi
              sleep 5
            done
            if [ -z "$API_CID" ]; then
              echo "❌ A nova task da API não ficou pronta no prazo."
              docker service ps "$API_SVC" --no-trunc
              exit 1
            fi
            docker exec "$API_CID" node dist/scripts/efreteConnectivityCheck.js homologacao
            echo "Staging deploy OK: ${{ steps.vars.outputs.SHA_TAG }}"
