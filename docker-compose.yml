services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: tsmex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tsmex
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tsmex-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tsmex-redis
    restart: unless-stopped
    ports:
      - "6390:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tsmex-network

  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ghcr.io/${GITHUB_REPOSITORY:-local/tsmex}/tsmex-api:${IMAGE_TAG:-local}
    container_name: tsmex-api
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/tsmex?schema=public}
      JWT_SECRET: ${JWT_SECRET:-jwt_super_secret_key_development_only_1234567890}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: ${PORT:-3002}
      NODE_ENV: ${NODE_ENV:-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # ---------------------------------------------------------------------------
      # Portainer / host: variáveis abaixo devem ser definidas na stack (sem commitar valores).
      # O Compose interpola ${VAR} a partir do ambiente do host; dentro do container ficam vazias
      # se não forem passadas (não use env_file com segredos no repositório).
      #
      # Core API: DATABASE_URL, JWT_SECRET, JWT_EXPIRES_IN, PORT, NODE_ENV, CORS_ORIGIN (acima: valores padrão local; em Portainer defina para produção)
      # ACBr (OAuth2 / HTTP): ACBR_CLIENT_ID, ACBR_CLIENT_SECRET
      # ACBr opcional: ACBR_TOKEN_URL, ACBR_API_BASE_URL, ACBR_FALLBACK_CMUN (ver server/src/services/acbr/acbrConfig.ts e acbrIbge.ts)
      # Fiscal: FISCAL_SECRET_KEY (criptografia da senha do .pfx no banco); FISCAL_CTE_PROVIDER ou FISCAL_PROVIDER=acbr para forçar HTTP ACBr
      # Object storage (certificados A1 / uploads; sinônimos MINIO_* em server/src/lib/objectStorage.ts):
      #   S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY, S3_REGION, S3_BUCKET, S3_FORCE_PATH_STYLE,
      #   S3_PUBLIC_BASE_URL, S3_SIGNED_URL_PUBLIC_HOST (+ MINIO_* equivalentes)
      # Outros: SINTEGRA_TOKEN, UPLOAD_MAX_SIZE_BYTES (se usar)
      # ---------------------------------------------------------------------------
      ACBR_CLIENT_ID: ${ACBR_CLIENT_ID:-}
      ACBR_CLIENT_SECRET: ${ACBR_CLIENT_SECRET:-}
      ACBR_TOKEN_URL: ${ACBR_TOKEN_URL:-}
      ACBR_API_BASE_URL: ${ACBR_API_BASE_URL:-}
      ACBR_FALLBACK_CMUN: ${ACBR_FALLBACK_CMUN:-}
      FISCAL_CTE_PROVIDER: ${FISCAL_CTE_PROVIDER:-}
      FISCAL_PROVIDER: ${FISCAL_PROVIDER:-}
      FISCAL_SECRET_KEY: ${FISCAL_SECRET_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_SIGNED_URL_PUBLIC_HOST: ${S3_SIGNED_URL_PUBLIC_HOST:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_REGION: ${MINIO_REGION:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-}
      SINTEGRA_TOKEN: ${SINTEGRA_TOKEN:-}
      UPLOAD_MAX_SIZE_BYTES: ${UPLOAD_MAX_SIZE_BYTES:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tsmex-network

  # CT-e emission worker (processa a fila BullMQ em background, isolado da API)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ghcr.io/${GITHUB_REPOSITORY:-local/tsmex}/tsmex-api:${IMAGE_TAG:-local}
    container_name: tsmex-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/tsmex?schema=public}
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ACBR_CLIENT_ID: ${ACBR_CLIENT_ID:-}
      ACBR_CLIENT_SECRET: ${ACBR_CLIENT_SECRET:-}
      ACBR_TOKEN_URL: ${ACBR_TOKEN_URL:-}
      ACBR_API_BASE_URL: ${ACBR_API_BASE_URL:-}
      ACBR_FALLBACK_CMUN: ${ACBR_FALLBACK_CMUN:-}
      FISCAL_CTE_PROVIDER: ${FISCAL_CTE_PROVIDER:-}
      FISCAL_PROVIDER: ${FISCAL_PROVIDER:-}
      FISCAL_SECRET_KEY: ${FISCAL_SECRET_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_SIGNED_URL_PUBLIC_HOST: ${S3_SIGNED_URL_PUBLIC_HOST:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_REGION: ${MINIO_REGION:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tsmex-network

  # Database migrations and seed (runs once then exits)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    image: ghcr.io/${GITHUB_REPOSITORY:-local/tsmex}/tsmex-migrate:${IMAGE_TAG:-local}
    container_name: tsmex-migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/tsmex?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tsmex-network

  # Frontend Web
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ghcr.io/${GITHUB_REPOSITORY:-local/tsmex}/tsmex-web:${IMAGE_TAG:-local}
    container_name: tsmex-web
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # Proxy /api → backend. Em Swarm costuma ser "tasks.api"; Compose local: "api". Não precisa de ACBR_*.
      NGINX_API_HOST: ${NGINX_API_HOST:-api}
    depends_on:
      - api
    networks:
      - tsmex-network

volumes:
  postgres_data:
  redis_data:


networks:
  tsmex-network:
    driver: bridge
