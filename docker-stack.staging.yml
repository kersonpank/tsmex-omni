version: "3.8"

# =============================================================
# TSM EX OMNI — Docker Swarm Stack: STAGING
# Domínio: tsm.mesquitagrupo.com.br
# Deploy: automático via GitHub Actions (branch develop)
# =============================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tsmex
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tsmex-staging-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tsmex-staging-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_staging_data:/data
    networks:
      - ProxyGM
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=ProxyGM"
        - "traefik.http.routers.tsmex-staging-minio.rule=Host(`${MINIO_HOST}`)"
        - "traefik.http.routers.tsmex-staging-minio.entrypoints=websecure"
        - "traefik.http.routers.tsmex-staging-minio.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.tsmex-staging-minio.loadbalancer.server.port=9000"

  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY}/tsmex-migrate:staging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # deploy: aplica migrações versionadas em ordem (normalização segura de enum etc).
      # NUNCA usar `push` (db push --accept-data-loss) em staging/prod: faz diff automático,
      # ignora as migrações versionadas e pode dropar dados / falhar em AlterEnum.
      MIGRATE_MODE: deploy
      RUN_SEED: "true" # TEMP: rodar seed uma vez pós-reset. Reverter após confirmar acesso.
      RUN_MIGRATE_PERSONS: ${RUN_MIGRATE_PERSONS:-false}
    networks:
      - tsmex-staging-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  api:
    image: ghcr.io/${GITHUB_REPOSITORY}/tsmex-api:staging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3002
      HOST: "0.0.0.0"
      NODE_ENV: production
      # Nome qualificado do serviço Swarm, não o alias curto "redis": o container `api` também
      # está na rede compartilhada `ProxyGM` (necessário para o Traefik rotear /api), e outro
      # stack neste mesmo host (`resio-producao`) também registra o alias curto "redis" nessa
      # rede compartilhada — isso fazia o DNS resolver "redis" para o Redis de PRODUÇÃO de outro
      # cliente em vez do Redis deste stack. Ver docs/STACK_ROLLOUT_RUNBOOK.md.
      REDIS_URL: ${REDIS_URL:-redis://staging-tsmex-dev_redis:6379}
      CORS_ORIGIN: https://tsm.mesquitagrupo.com.br
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      S3_SIGNED_URL_PUBLIC_HOST: ${S3_SIGNED_URL_PUBLIC_HOST}
      UPLOAD_MAX_SIZE_BYTES: ${UPLOAD_MAX_SIZE_BYTES:-10485760}
      ACBR_CLIENT_ID: ${ACBR_CLIENT_ID:-}
      ACBR_CLIENT_SECRET: ${ACBR_CLIENT_SECRET:-}
      ACBR_CLIENT_ID_PRODUCAO: ${ACBR_CLIENT_ID_PRODUCAO:-}
      ACBR_CLIENT_SECRET_PRODUCAO: ${ACBR_CLIENT_SECRET_PRODUCAO:-}
      ACBR_TOKEN_URL: ${ACBR_TOKEN_URL:-}
      ACBR_API_BASE_URL: ${ACBR_API_BASE_URL:-}
      ACBR_FALLBACK_CMUN: ${ACBR_FALLBACK_CMUN:-}
      FISCAL_CTE_PROVIDER: ${FISCAL_CTE_PROVIDER:-}
      FISCAL_PROVIDER: ${FISCAL_PROVIDER:-}
      FISCAL_SECRET_KEY: ${FISCAL_SECRET_KEY:-}
      SINTEGRA_TOKEN: ${SINTEGRA_TOKEN:-}
    # ProxyGM: Traefik encaminha /api direto à API (evita 502 do Nginx web->api na overlay).
    networks:
      - tsmex-staging-internal
      - ProxyGM
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=ProxyGM"
        - "traefik.http.routers.tsmex-staging-api.rule=Host(`tsm.mesquitagrupo.com.br`) && PathPrefix(`/api`)"
        - "traefik.http.routers.tsmex-staging-api.entrypoints=websecure"
        - "traefik.http.routers.tsmex-staging-api.priority=100"
        - "traefik.http.routers.tsmex-staging-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.tsmex-staging-api.loadbalancer.server.port=3002"

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY}/tsmex-api:staging
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      # Ver comentário equivalente no serviço `api` acima — mesmo motivo (colisão de DNS
      # com o Redis de outro stack via a rede compartilhada ProxyGM).
      REDIS_URL: ${REDIS_URL:-redis://staging-tsmex-dev_redis:6379}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      S3_SIGNED_URL_PUBLIC_HOST: ${S3_SIGNED_URL_PUBLIC_HOST}
      UPLOAD_MAX_SIZE_BYTES: ${UPLOAD_MAX_SIZE_BYTES:-10485760}
      ACBR_CLIENT_ID: ${ACBR_CLIENT_ID:-}
      ACBR_CLIENT_SECRET: ${ACBR_CLIENT_SECRET:-}
      ACBR_CLIENT_ID_PRODUCAO: ${ACBR_CLIENT_ID_PRODUCAO:-}
      ACBR_CLIENT_SECRET_PRODUCAO: ${ACBR_CLIENT_SECRET_PRODUCAO:-}
      ACBR_TOKEN_URL: ${ACBR_TOKEN_URL:-}
      ACBR_API_BASE_URL: ${ACBR_API_BASE_URL:-}
      ACBR_FALLBACK_CMUN: ${ACBR_FALLBACK_CMUN:-}
      FISCAL_CTE_PROVIDER: ${FISCAL_CTE_PROVIDER:-}
      FISCAL_PROVIDER: ${FISCAL_PROVIDER:-}
      FISCAL_SECRET_KEY: ${FISCAL_SECRET_KEY:-}
    # Healthcheck ativo valida conectividade TCP com Redis e Postgres a cada 20s.
    # Em caso de congelamento do socket TCP no Swarm, o container e auto-reiniciado.
    healthcheck:
      test: ["CMD", "node", "dist/workerHealth.js"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - tsmex-staging-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s

  web:
    image: ghcr.io/${GITHUB_REPOSITORY}/tsmex-web:staging
    environment:
      # Swarm: DNS tasks.* aponta para o IP da task (evita VIP "api" com connection refused no Nginx).
      NGINX_API_HOST: tasks.api
    networks:
      - tsmex-staging-internal
      - ProxyGM
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.tsmex-staging.rule=Host(`tsm.mesquitagrupo.com.br`)"
        - "traefik.http.routers.tsmex-staging.entrypoints=websecure"
        - "traefik.http.routers.tsmex-staging.priority=1"
        - "traefik.http.routers.tsmex-staging.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.tsmex-staging.loadbalancer.server.port=80"

volumes:
  postgres_staging_data:
  redis_staging_data:
  minio_staging_data:

networks:
  tsmex-staging-internal:
    driver: overlay
  ProxyGM:
    external: true
